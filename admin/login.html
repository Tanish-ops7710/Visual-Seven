<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Seven - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="min-h-screen bg-[#0a0e27] relative overflow-hidden flex items-center justify-center">
        <!-- Animated Gradient Background -->
        <div class="absolute inset-0 neon-gradient opacity-10"></div>
        
        <!-- Floating Particles -->
        <div class="particle-blob particle-blob-1"></div>
        <div class="particle-blob particle-blob-2"></div>
        <div class="particle-blob particle-blob-3"></div>
        
        <!-- Dark Overlay -->
        <div class="absolute inset-0 bg-gradient-to-br from-[#0a0e27] via-black/50 to-[#0a0e27]"></div>
        
        <!-- Login Card -->
        <div class="login-card relative z-10 w-full max-w-md mx-4">
            <div class="bg-black/40 backdrop-blur-2xl border border-white/10 rounded-3xl p-10 neon-glow-blue">
                <!-- Logo & Branding -->
                <div class="text-center mb-8">
                    <div class="mb-4">
                        <img src="../images/logo-dark.png" alt="Visual Seven" class="h-24 w-auto mx-auto drop-shadow-[0_0_20px_rgba(0,217,255,0.3)]">
                    </div>
                    <p class="text-white/60 text-sm">Admin Portal Access</p>
                </div>

                <!-- Error / Success Message -->
                <div id="error-message" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center"></div>
                
                <!-- Login Form -->
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-white/80 mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40">
                                <iconify-icon icon="lucide:mail" class="text-xl"></iconify-icon>
                            </div>
                            <input type="email" id="email" placeholder="admin@visualseven.com" required
                                class="input-field w-full pl-12 pr-4 py-3.5 border border-white/20 rounded-xl text-white placeholder:text-white/30">
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-white/80 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-white/40">
                                <iconify-icon icon="lucide:lock" class="text-xl"></iconify-icon>
                            </div>
                            <input type="password" id="password" placeholder="••••••••" required
                                class="input-field w-full pl-12 pr-12 py-3.5 border border-white/20 rounded-xl text-white placeholder:text-white/30">
                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/60 transition-colors">
                                <iconify-icon icon="lucide:eye" class="text-xl"></iconify-icon>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" id="remember" class="checkbox-custom">
                            <span class="text-sm text-white/60 group-hover:text-white/80 transition-colors">Remember me</span>
                        </label>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="btn-primary w-full py-4 bg-gradient-to-r from-[#00d9ff] to-[#b000ff] rounded-xl font-semibold text-white text-lg shadow-lg flex items-center justify-center gap-3">
                        <span id="submit-spinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                        <span id="submit-text">Sign In</span>
                    </button>
                </form>

                <!-- Register link (first-time setup) -->
                <div class="mt-6 text-center">
                    <p class="text-white/40 text-sm">First time? 
                        <button onclick="toggleRegisterMode()" id="toggle-mode-btn" class="text-[#00d9ff] hover:underline font-medium">Create account</button>
                    </p>
                </div>
                
                <!-- Security Badges -->
                <div class="mt-8 pt-6 border-t border-white/10">
                    <p class="text-center text-xs text-white/40 mb-4">Secured & Protected</p>
                    <div class="flex items-center justify-center gap-4">
                        <div class="security-badge flex items-center gap-2 px-3 py-2 bg-white/5 border border-white/10 rounded-lg">
                            <iconify-icon icon="lucide:shield-check" class="text-green-400"></iconify-icon>
                            <span class="text-xs text-white/60">SSL Encrypted</span>
                        </div>
                        <div class="security-badge flex items-center gap-2 px-3 py-2 bg-white/5 border border-white/10 rounded-lg">
                            <iconify-icon icon="lucide:fingerprint" class="text-blue-400"></iconify-icon>
                            <span class="text-xs text-white/60">2FA Ready</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="text-center mt-6 text-xs text-white/40">© 2024 Visual Seven. Unauthorized access prohibited.</p>
        </div>
    </div>
    
    <!-- Load Supabase config first, then auth helpers, then page logic -->
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let isRegisterMode = false;

        // Redirect to dashboard if already logged in
        (async () => { await redirectIfLoggedIn(); })();

        function toggleRegisterMode() {
            isRegisterMode = !isRegisterMode;
            const submitText = document.getElementById('submit-text');
            const toggleBtn = document.getElementById('toggle-mode-btn');
            submitText.textContent = isRegisterMode ? 'Create Account' : 'Sign In';
            toggleBtn.textContent = isRegisterMode ? 'Sign in instead' : 'Create account';
        }

        // Password toggle
        document.getElementById('toggle-password').addEventListener('click', () => {
            const pw = document.getElementById('password');
            const isPassword = pw.type === 'password';
            pw.type = isPassword ? 'text' : 'password';
            document.querySelector('#toggle-password iconify-icon').setAttribute('icon', isPassword ? 'lucide:eye-off' : 'lucide:eye');
        });

        // Single form submit handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            const submitBtn    = document.getElementById('submit-btn');
            const submitText   = document.getElementById('submit-text');
            const submitSpinner = document.getElementById('submit-spinner');

            // Reset error
            errorMsg.classList.add('hidden');
            errorMsg.className = 'hidden mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center';

            // Loading state
            submitBtn.disabled = true;
            submitText.textContent = isRegisterMode ? 'Creating...' : 'Signing in...';
            submitSpinner.classList.remove('hidden');

            try {
                if (isRegisterMode) {
                    await signUp(email, password);
                    errorMsg.textContent = 'Account created! Check your email to confirm, then sign in.';
                    errorMsg.className = 'mb-6 p-4 bg-green-500/10 border border-green-500/30 rounded-xl text-green-400 text-sm text-center';
                    errorMsg.classList.remove('hidden');
                    toggleRegisterMode();
                } else {
                    await signIn(email, password);
                    window.location.href = '/admin/dashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = err.message === 'Invalid login credentials'
                    ? 'Invalid email or password. Please try again.'
                    : (err.message || 'Authentication failed.');
                errorMsg.className = 'mb-6 p-4 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm text-center';
                errorMsg.classList.remove('hidden');
                submitText.textContent = isRegisterMode ? 'Create Account' : 'Sign In';
            } finally {
                submitBtn.disabled = false;
                submitSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
