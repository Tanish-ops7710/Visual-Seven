<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Visual Seven</title>
    <meta name="description" content="Explore our portfolio of premium neon signs, LED signage, and custom branding projects.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="min-h-screen bg-black text-white">
        <!-- Navigation -->
        <nav class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <a href="index.html" class="flex items-center">
                    <img src="images/logo-dark.png" alt="Visual Seven" class="h-10 w-auto">
                </a>
                <div class="hidden md:flex items-center gap-8">
                    <a href="index.html" class="nav-link text-sm font-medium text-white/90 hover:text-white">Home</a>
                    <a href="portfolio.html" class="nav-link text-sm font-medium text-white hover:text-white">Portfolio</a>
                    <a href="index.html#services" class="nav-link text-sm font-medium text-white/90 hover:text-white">Services</a>
                    <a href="contact.html" class="nav-link text-sm font-medium text-white/90 hover:text-white">Contact</a>
                    <a href="custom-sign.html" class="px-5 py-2 bg-gradient-to-r from-[#00d9ff] to-[#b000ff] rounded-full text-xs font-semibold hover:shadow-[0_0_20px_rgba(0,217,255,0.4)] transition-all flex items-center gap-1.5 border border-white/10">
                        <iconify-icon icon="lucide:zap" class="text-sm animate-pulse"></iconify-icon> Design Neon
                    </a>
                    <a href="admin/login.html" class="w-9 h-9 bg-white/5 hover:bg-gradient-to-r hover:from-[#00d9ff] hover:to-[#b000ff] border border-white/10 rounded-lg flex items-center justify-center transition-all" title="Admin Panel">
                        <iconify-icon icon="lucide:lock" class="text-sm text-white/50 hover:text-white"></iconify-icon>
                    </a>
                </div>
                <button class="md:hidden text-white/80" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                    <iconify-icon icon="lucide:menu" class="text-2xl"></iconify-icon>
                </button>
            </div>
            <div id="mobile-menu" class="hidden md:hidden border-t border-white/10 bg-black/95 backdrop-blur-xl px-6 py-4 flex flex-col gap-3">
                <a href="index.html" class="text-sm font-medium text-white/90 py-2">Home</a>
                <a href="portfolio.html" class="text-sm font-medium text-white py-2">Portfolio</a>
                <a href="index.html#services" class="text-sm font-medium text-white/90 py-2">Services</a>
                <a href="contact.html" class="text-sm font-medium text-white/90 py-2">Contact</a>
                <a href="custom-sign.html" class="text-sm font-semibold text-[#00d9ff] py-2 flex items-center gap-1.5"><iconify-icon icon="lucide:zap"></iconify-icon> Design Neon</a>
                <a href="admin/login.html" class="text-sm font-medium text-white/55 py-2 flex items-center gap-2"><iconify-icon icon="lucide:lock" class="text-sm"></iconify-icon> Admin</a>
            </div>
        </nav>

        <!-- Hero -->
        <section class="pt-32 pb-12 px-6 bg-gradient-to-b from-[#0a0e27] to-black relative overflow-hidden">
            <div class="absolute inset-0 neon-gradient opacity-10"></div>
            <div class="relative z-10 max-w-7xl mx-auto text-center">
                <h1 class="text-4xl md:text-6xl font-bold neon-text mb-4">Our Portfolio</h1>
                <p class="text-lg md:text-xl text-white/60 max-w-2xl mx-auto">Explore our collection of premium signage and branding projects</p>
            </div>
        </section>

        <!-- Filter & Grid -->
        <section class="py-12 px-6 bg-black">
            <div class="max-w-7xl mx-auto">
                <!-- Filter Buttons -->
                <div id="filter-buttons" class="flex flex-wrap items-center justify-center gap-3 mb-12"></div>
                <!-- Project Grid -->
                <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </section>

        <!-- Lightbox Modal -->
        <div id="lightbox-modal" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl items-center justify-center" onclick="if(event.target===this)closeLightbox()">
            <div class="relative w-full max-w-5xl mx-4">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h3 id="lightbox-title" class="text-xl font-semibold"></h3>
                        <span id="lightbox-counter" class="text-sm text-white/50"></span>
                    </div>
                    <button onclick="closeLightbox()" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-colors">
                        <iconify-icon icon="lucide:x" class="text-xl"></iconify-icon>
                    </button>
                </div>
                <div class="relative">
                    <div id="lightbox-gallery" class="flex overflow-hidden rounded-xl snap-x snap-mandatory"></div>
                    <button id="lightbox-prev" onclick="lightboxPrev()" class="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-black/60 hover:bg-black/80 rounded-full flex items-center justify-center transition-colors">
                        <iconify-icon icon="lucide:chevron-left" class="text-2xl"></iconify-icon>
                    </button>
                    <button id="lightbox-next" onclick="lightboxNext()" class="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 bg-black/60 hover:bg-black/80 rounded-full flex items-center justify-center transition-colors">
                        <iconify-icon icon="lucide:chevron-right" class="text-2xl"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="py-12 px-6 bg-black border-t border-white/10">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                <a href="index.html"><img src="images/logo-dark.png" alt="Visual Seven" class="h-10 w-auto"></a>
                <p class="text-white/40 text-sm">© 2024 Visual Seven. All rights reserved.</p>
                <div class="flex gap-4">
                    <a href="#" class="w-9 h-9 bg-white/10 hover:bg-gradient-to-r hover:from-[#00d9ff] hover:to-[#b000ff] rounded-lg flex items-center justify-center transition-all"><iconify-icon icon="lucide:instagram" class="text-lg"></iconify-icon></a>
                    <a href="#" class="w-9 h-9 bg-white/10 hover:bg-gradient-to-r hover:from-[#00d9ff] hover:to-[#b000ff] rounded-lg flex items-center justify-center transition-all"><iconify-icon icon="lucide:facebook" class="text-lg"></iconify-icon></a>
                    <a href="#" class="w-9 h-9 bg-white/10 hover:bg-gradient-to-r hover:from-[#00d9ff] hover:to-[#b000ff] rounded-lg flex items-center justify-center transition-all"><iconify-icon icon="lucide:linkedin" class="text-lg"></iconify-icon></a>
                </div>
            </div>
        </footer>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/portfolio.js"></script>
</body>
</html>
